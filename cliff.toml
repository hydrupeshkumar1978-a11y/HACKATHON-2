# Git-Cliff configuration for Interview Simulator
# Generates automated changelogs from conventional commits

[changelog]
# Project information
title = "Changelog"
description = "A browser-based interview simulator with AI-driven Q&A, resume uploads, and transcript export."
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

# changelog body
body = """
{% if version %}\
    ## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper }}
    {% for commit in commits %}
    - {% if commit.breaking %}[**BREAKING**] {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`]({{ commit.links[0].href }}))
    {%- if commit.body %} - {{ commit.body | split(pat="\n") | first }}{% endif %}\
    {% endfor %}
{% endfor %}\n
"""

# remove the leading and trailing whitespace from the template
trim = true

# changelog footer
footer = """
{% for release in releases -%}
    {% if release.version -%}
        ## [{{ release.version }}] - {{ release.timestamp | date(format="%Y-%m-%d") }}
    {% endif -%}
{% endfor %}
"""

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for parsing the commit messages
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
default_commit_group = "Other"
# default description for the changelog body template, server errors are grouped under `default_group`
default_commit_group_title = "Other"
# for each prefix, trim all leading characters until the given prefix
trim_commits = [
    { pattern = "^Merge", text = "" },
    { pattern = "^Revert", text = "" },
]

[remote.github]
owner = "hydrupeshkumar"
repo = "hackathon-2"

