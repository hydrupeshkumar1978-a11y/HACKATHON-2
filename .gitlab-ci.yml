image: node:20

stages:
  - lint
  - format
  - type_check
  - coverage
  - test

before_script:
  - export BUN_INSTALL="$HOME/.bun"
  - curl -fsSL https://bun.sh/install | bash
  - export PATH="$BUN_INSTALL/bin:$PATH"
  - bun install

lint:
  stage: lint
  script:
    - npx eslint . --ext .ts,.js
  rules:
    - when: always

format:
  stage: format
  script:
    - npx prettier --check .
  rules:
    - when: always

type_check:
  stage: type_check
  script:
    - npx tsc --noEmit
  rules:
    - when: always

coverage:
  stage: coverage
  script:
    - npx vitest run --coverage
  rules:
    - when: always

test:
  stage: test
  script:
    - npx vitest run
  rules:
    - when: always
