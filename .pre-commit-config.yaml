repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: eslint
        name: ESLint
        entry: bun run lint
        language: system
        pass_filenames: false
      - id: prettier
        name: Prettier
        entry: prettier --check .
        language: system
        pass_filenames: false
      - id: typecheck
        name: TypeCheck
        entry: bun run typecheck
        language: system
        pass_filenames: false
      - id: gitleaks
        name: Secret scan
        entry: gitleaks detect --source .
        language: system
        pass_filenames: false
